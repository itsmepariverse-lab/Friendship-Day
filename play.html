<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">
    <title>MC Season 1 - Streaming</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #141414; /* Netflix dark theme */
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        .header {
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #E50914; /* Netflix Red */
            margin: 0;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin-top: 40px;
        }

        .video-wrapper {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            background: #000;
            position: relative;
        }

        /* Overlay for touch interactions */
        .touch-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 50px; /* leave room for controls */
            z-index: 10;
            touch-action: manipulation;
        }

        /* Feedback badges (2x speed, skip) */
        .feedback-badge {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            pointer-events: none;
            display: none;
            z-index: 20;
            font-size: 14px;
        }

        .seek-feedback {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 20px;
            border-radius: 50%;
            font-size: 24px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        .seek-left { left: 15%; }
        .seek-right { right: 15%; }

        .ep-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 15;
            user-select: none;
            transition: background 0.2s, opacity 0.2s;
        }
        .ep-nav-btn:hover { background: rgba(229,9,20,0.85); }
        .ep-nav-btn.disabled { opacity: 0.25; pointer-events: none; }
        .ep-nav-btn.nav-hidden { opacity: 0; pointer-events: none; }
        #ep-prev-btn { left: 12px; }
        #ep-next-btn { right: 12px; }

        .up-next-overlay {
            position: absolute;
            bottom: 70px;
            right: 16px;
            z-index: 25;
            background: rgba(20,20,20,0.92);
            border-radius: 8px;
            padding: 14px 16px;
            width: 220px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }
        .up-next-overlay.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .up-next-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; margin-bottom: 4px; }
        .up-next-title { font-weight: bold; margin-bottom: 12px; }
        .up-next-actions { display: flex; gap: 8px; }
        .up-next-actions button {
            flex: 1;
            border: none;
            border-radius: 4px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        #up-next-cancel { background: #333; color: #fff; }
        #up-next-cancel:hover { background: #444; }
        #up-next-play { background: #E50914; color: #fff; }
        #up-next-play:hover { background: #f6121d; }

        .episode-list {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            overflow-x: auto;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .episode-list::-webkit-scrollbar {
            display: none;
        }

        .episode-card {
            background-color: #2f2f2f;
            border-radius: 4px;
            padding: 15px 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            white-space: nowrap;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .episode-card:hover {
            transform: scale(1.05);
            background-color: #404040;
        }

        .episode-card.active {
            background-color: #E50914;
            color: white;
        }

        .subtitle-btn {
            background: #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .subtitle-btn:hover { background: #444; }

        /* Customizing Plyr colors */
        :root {
            --plyr-color-main: #E50914;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MC Season 1</h1>
    </div>

    <div class="container">
        <div class="video-wrapper" id="video-container">
            <video id="player" crossorigin playsinline></video>
            <div class="touch-overlay" id="touch-overlay"></div>
            <div class="feedback-badge" id="speed-badge">▶▶ 2x Speed</div>
            <div class="seek-feedback seek-left" id="seek-left">⏪ 10s</div>
            <div class="seek-feedback seek-right" id="seek-right">⏩ 10s</div>
            <div class="ep-nav-btn" id="ep-prev-btn" title="Previous Episode">&#10094;</div>
            <div class="ep-nav-btn" id="ep-next-btn" title="Next Episode">&#10095;</div>
            <div class="up-next-overlay" id="up-next-overlay">
                <div class="up-next-label">Next Episode</div>
                <div class="up-next-title" id="up-next-title"></div>
                <div class="up-next-actions">
                    <button id="up-next-cancel">Cancel</button>
                    <button id="up-next-play">Play (<span id="up-next-count">5</span>)</button>
                </div>
            </div>
        </div>
        
        <label class="subtitle-btn" for="subtitle-upload">
            📄 Add Subtitles (.srt)
            <input type="file" id="subtitle-upload" accept=".srt" style="display: none;">
        </label>

        <h3 style="margin-top: 30px;">Episodes</h3>
        <div class="episode-list" id="episode-list">
            <!-- Episode buttons generated dynamically -->
        </div>
    </div>

    <!-- HLS.js and Plyr.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const video = document.getElementById('player');
        const overlay = document.getElementById('touch-overlay');
        const speedBadge = document.getElementById('speed-badge');
        const seekLeft = document.getElementById('seek-left');
        const seekRight = document.getElementById('seek-right');
        const prevBtn = document.getElementById('ep-prev-btn');
        const nextBtn = document.getElementById('ep-next-btn');

        const baseUrl = 'https://pub-b8f191bed429408cb704c0e9d9dc5b11.r2.dev/hls';
        const episodes = ['ep01', 'ep02', 'ep03', 'ep04', 'ep05', 'ep06', 'ep07', 'ep08'];
        
        let player;
        let hls;
        let currentEpisode = '';

        function initPlyr() {
            player = new Plyr(video, {
                captions: { active: true, update: true, language: 'auto' },
                fullscreen: { container: '.video-wrapper' }
            });

            // Mobile landscape orientation lock
            player.on('enterfullscreen', () => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            });
            player.on('exitfullscreen', () => {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            });

            // Keep the prev/next buttons in sync with Plyr's own control visibility
            // (Plyr toggles the "plyr--hide-controls" class during playback/inactivity)
            const syncNavVisibility = () => {
                const hidden = player.elements.container.classList.contains('plyr--hide-controls');
                prevBtn.classList.toggle('nav-hidden', hidden);
                nextBtn.classList.toggle('nav-hidden', hidden);
            };
            new MutationObserver(syncNavVisibility).observe(player.elements.container, {
                attributes: true,
                attributeFilter: ['class']
            });
        }

        function loadVideo(episode) {
            hideUpNext();
            currentEpisode = episode;
            const source = `${baseUrl}/${episode}/index.m3u8`;
            const savedTime = localStorage.getItem(`mc_progress_${episode}`);

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    if (savedTime) video.currentTime = parseFloat(savedTime);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.addEventListener('loadedmetadata', function() {
                    if (savedTime) video.currentTime = parseFloat(savedTime);
                }, { once: true });
            }

            // Update UI
            document.querySelectorAll('.episode-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`btn-${episode}`).classList.add('active');
            updateNavButtons();
        }

        function goToEpisode(offset) {
            const idx = episodes.indexOf(currentEpisode) + offset;
            if (idx < 0 || idx >= episodes.length) return;
            loadVideo(episodes[idx]);
            video.play().catch(() => { /* Ignore autoplay blocks */ });
        }

        function updateNavButtons() {
            const idx = episodes.indexOf(currentEpisode);
            prevBtn.classList.toggle('disabled', idx <= 0);
            nextBtn.classList.toggle('disabled', idx >= episodes.length - 1);
        }

        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goToEpisode(-1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goToEpisode(1); });

        // Generate UI buttons
        const listContainer = document.getElementById('episode-list');
        episodes.forEach(ep => {
            const btn = document.createElement('div');
            btn.className = 'episode-card';
            btn.id = `btn-${ep}`;
            btn.innerText = `Episode ${ep.replace('ep0', '').replace('ep', '')}`;
            btn.onclick = () => {
                // Auto play when manually clicking an episode
                loadVideo(ep);
                video.play().catch(()=> { /* Ignore autoplay blocks */ });
            };
            listContainer.appendChild(btn);
        });

        // 1. Remember playback position
        video.addEventListener('timeupdate', () => {
            if (video.currentTime > 5 && !video.ended) {
                localStorage.setItem(`mc_progress_${currentEpisode}`, video.currentTime);
            }
        });

        // 2. Autoplay next episode with an "Up Next" countdown
        const upNextOverlay = document.getElementById('up-next-overlay');
        const upNextTitle = document.getElementById('up-next-title');
        const upNextCount = document.getElementById('up-next-count');
        let upNextTimeout = null;
        let upNextInterval = null;
        let pendingNextEpisode = null;

        function showUpNext(nextEpisode) {
            pendingNextEpisode = nextEpisode;
            upNextTitle.textContent = `Episode ${nextEpisode.replace('ep0', '').replace('ep', '')}`;
            let count = 5;
            upNextCount.textContent = count;
            upNextOverlay.classList.add('visible');

            upNextInterval = setInterval(() => {
                count -= 1;
                upNextCount.textContent = Math.max(count, 0);
                if (count <= 0) clearInterval(upNextInterval);
            }, 1000);

            upNextTimeout = setTimeout(() => {
                const next = pendingNextEpisode;
                hideUpNext();
                loadVideo(next);
                video.play().catch(() => {});
            }, 5000);
        }

        function hideUpNext() {
            clearTimeout(upNextTimeout);
            clearInterval(upNextInterval);
            upNextOverlay.classList.remove('visible');
            pendingNextEpisode = null;
        }

        document.getElementById('up-next-cancel').addEventListener('click', hideUpNext);
        document.getElementById('up-next-play').addEventListener('click', () => {
            const next = pendingNextEpisode;
            hideUpNext();
            if (next) {
                loadVideo(next);
                video.play().catch(() => {});
            }
        });

        video.addEventListener('ended', () => {
            const currentIndex = episodes.indexOf(currentEpisode);
            if (currentIndex < episodes.length - 1) {
                localStorage.removeItem(`mc_progress_${currentEpisode}`); // Clear finished state
                showUpNext(episodes[currentIndex + 1]);
            }
        });

        // 3. Touch Gestures (Single Tap to Play/Pause, Double Tap to Seek, Hold for 2x)
        let holdTimeout;
        let tapTimeout = null;
        let lastTap = 0;
        let isHolding = false;

        function showSeekFeedback(el) {
            el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 500);
        }

        overlay.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return;

            // Tap and Hold
            holdTimeout = setTimeout(() => {
                if (!video.paused) {
                    isHolding = true;
                    video.playbackRate = 2.0;
                    speedBadge.style.display = 'block';
                }
            }, 500);
        });

        const endHold = () => {
            clearTimeout(holdTimeout);
            if (isHolding) {
                video.playbackRate = 1.0;
                speedBadge.style.display = 'none';
                isHolding = false;
                return true; // release was ending a hold, not a tap
            }
            return false;
        };

        overlay.addEventListener('touchend', (e) => {
            const wasHolding = endHold();
            if (wasHolding) return;

            e.preventDefault(); // stop the synthetic click that would otherwise double-fire this
            const now = Date.now();
            const touchX = e.changedTouches[0].clientX;
            const screenWidth = window.innerWidth;

            if (now - lastTap < 300 && tapTimeout) {
                // Double tap: seek
                clearTimeout(tapTimeout);
                tapTimeout = null;
                lastTap = 0;
                if (touchX < screenWidth / 2) {
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSeekFeedback(seekLeft);
                } else {
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSeekFeedback(seekRight);
                }
            } else {
                // Wait to see if a second tap follows; otherwise it's a single tap
                lastTap = now;
                tapTimeout = setTimeout(() => {
                    tapTimeout = null;
                    if (video.paused) video.play();
                    else video.pause();
                }, 300);
            }
        });

        overlay.addEventListener('touchcancel', endHold);

        // Desktop mouse click (no touch events fire, so this is unaffected by the tap logic above)
        overlay.addEventListener('click', () => {
            if ('ontouchstart' in window) return; // avoid double-handling on touch devices
            if (video.paused) video.play();
            else video.pause();
        });

        // 4. Keyboard shortcuts (desktop)
        document.addEventListener('keydown', (e) => {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;

            switch (e.key) {
                case ' ':
                case 'Spacebar':
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                    break;
                case 'ArrowLeft':
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSeekFeedback(seekLeft);
                    break;
                case 'ArrowRight':
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSeekFeedback(seekRight);
                    break;
                case 'f':
                case 'F':
                    player.fullscreen.toggle();
                    break;
            }
        });

        // 5. Subtitle SRT to VTT Converter
        function srt2vtt(srt) {
            let vtt = 'WEBVTT\n\n';
            let lines = srt.replace(/\r+/g, '').split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (line.match(/^\d+$/)) continue; // sequence numbers
                if (line.match(/^\d{2}:\d{2}:\d{2}/)) {
                    line = line.replace(/,/g, '.'); // times
                }
                vtt += line + '\n';
            }
            return vtt;
        }

        document.getElementById('subtitle-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const vttContent = srt2vtt(e.target.result);
                const blob = new Blob([vttContent], { type: 'text/vtt' });
                const url = URL.createObjectURL(blob);
                
                // Remove existing custom tracks
                Array.from(video.querySelectorAll('track.custom-track')).forEach(t => t.remove());

                const track = document.createElement('track');
                track.kind = 'captions';
                track.label = file.name.replace('.srt', '');
                track.srclang = 'en';
                track.src = url;
                track.className = 'custom-track';
                track.default = true;
                
                video.appendChild(track);
                alert("Subtitles loaded! Enable them in the player settings gear icon.");
            };
            reader.readAsText(file);
        });

        // Start
        initPlyr();
        loadVideo(episodes[0]);
    </script>
</body>
</html>

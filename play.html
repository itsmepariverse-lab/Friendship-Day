<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">
    <title>MC Season 1 - Streaming</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #141414; /* Netflix dark theme */
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        .header {
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #E50914; /* Netflix Red */
            margin: 0;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin-top: 40px;
        }

        .video-wrapper {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            background: #000;
            position: relative;
        }

        /* Overlay for touch interactions */
        .touch-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 56px; /* leave room for Plyr's control bar */
            z-index: 10;
            touch-action: manipulation;
        }

        /* Feedback badges (2x speed, skip) */
        .feedback-badge {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            pointer-events: none;
            display: none;
            z-index: 20;
            font-size: 14px;
        }

        .seek-feedback {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 20px;
            border-radius: 50%;
            font-size: 24px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        .seek-left { left: 15%; }
        .seek-right { right: 15%; }

        .ep-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 15;
            user-select: none;
            transition: background 0.2s, opacity 0.2s;
        }
        .ep-nav-btn:hover { background: rgba(229,9,20,0.85); }
        .ep-nav-btn.disabled { opacity: 0.25; pointer-events: none; }
        .ep-nav-btn.nav-hidden { opacity: 0; pointer-events: none; }
        #ep-prev-btn { left: 12px; }
        #ep-next-btn { right: 12px; }

        .up-next-overlay {
            position: absolute;
            bottom: 70px;
            right: 16px;
            z-index: 25;
            background: rgba(20,20,20,0.92);
            border-radius: 8px;
            padding: 14px 16px;
            width: 220px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }
        .up-next-overlay.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .up-next-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; margin-bottom: 4px; }
        .up-next-title { font-weight: bold; margin-bottom: 12px; }
        .up-next-actions { display: flex; gap: 8px; }
        .up-next-actions button {
            flex: 1;
            border: none;
            border-radius: 4px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        #up-next-cancel { background: #333; color: #fff; }
        #up-next-cancel:hover { background: #444; }
        #up-next-play { background: #E50914; color: #fff; }
        #up-next-play:hover { background: #f6121d; }

        .episode-list {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            overflow-x: auto;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .episode-list::-webkit-scrollbar {
            display: none;
        }

        .episode-card {
            background-color: #2f2f2f;
            border-radius: 4px;
            padding: 15px 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            white-space: nowrap;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .episode-card:hover {
            transform: scale(1.05);
            background-color: #404040;
        }

        .episode-card.active {
            background-color: #E50914;
            color: white;
        }

        .subtitle-btn {
            background: #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .subtitle-btn:hover { background: #444; }

        /* Customizing Plyr colors */
        :root {
            --plyr-color-main: #E50914;
            /* Subtitle Customization Variables */
            --sub-font-family: 'Inter', sans-serif;
            --sub-color: #ffffff;
            --sub-bg: rgba(0, 0, 0, 0.7);
            --sub-size: 18px;
            --sub-bottom: 20px;
        }

        /* Target Plyr's custom captions */
        .plyr__captions .plyr__caption {
            font-family: var(--sub-font-family) !important;
            color: var(--sub-color) !important;
            background-color: var(--sub-bg) !important;
            font-size: var(--sub-size) !important;
            line-height: 1.4 !important;
            padding: 4px 8px !important;
            border-radius: 4px !important;
        }
        .plyr__captions {
            bottom: var(--sub-bottom) !important;
        }

        /* Subtitle Settings Modal */
        .settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #222;
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }
        .settings-modal.active { 
            opacity: 1; 
            visibility: visible; 
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .settings-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
        .settings-header h3 { margin: 0; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .setting-row { display: flex; flex-direction: column; gap: 5px; }
        .setting-row label { font-size: 14px; color: #ccc; }
        .setting-row select, .setting-row input[type="color"], .setting-row input[type="range"] {
            width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff;
        }
        .setting-row input[type="range"] { padding: 0; }
        .setting-row input[type="color"] { height: 40px; padding: 2px; }

        .subtitle-controls-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MC Season 1</h1>
    </div>

    <div class="container">
        <div class="video-wrapper" id="video-container">
            <video id="player" crossorigin playsinline></video>
            <div class="touch-overlay" id="touch-overlay"></div>
            <div class="feedback-badge" id="speed-badge">▶▶ 2x Speed</div>
            <div class="seek-feedback seek-left" id="seek-left">⏪ 10s</div>
            <div class="seek-feedback seek-right" id="seek-right">⏩ 10s</div>
            <div class="ep-nav-btn" id="ep-prev-btn" title="Previous Episode">&#10094;</div>
            <div class="ep-nav-btn" id="ep-next-btn" title="Next Episode">&#10095;</div>
            <div class="up-next-overlay" id="up-next-overlay">
                <div class="up-next-label">Next Episode</div>
                <div class="up-next-title" id="up-next-title"></div>
                <div class="up-next-actions">
                    <button id="up-next-cancel">Cancel</button>
                    <button id="up-next-play">Play (<span id="up-next-count">5</span>)</button>
                </div>
            </div>
        </div>
        
        <div class="subtitle-controls-row">
            <label class="subtitle-btn" for="subtitle-upload">
                📄 Upload Custom (.srt)
                <input type="file" id="subtitle-upload" accept=".srt" style="display: none;">
            </label>
            <button class="subtitle-btn" id="open-subtitle-settings">⚙️ Subtitle Settings</button>
        </div>

        <div class="settings-modal" id="subtitle-settings-modal">
            <div class="settings-header">
                <h3>Subtitle Settings</h3>
                <button class="close-btn" id="close-subtitle-settings">&times;</button>
            </div>
            <div class="setting-row">
                <label>Font Family</label>
                <select id="set-font">
                    <option value="'Inter', sans-serif">Sans-Serif</option>
                    <option value="'Merriweather', serif">Serif</option>
                    <option value="monospace">Monospace</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Text Color</label>
                <input type="color" id="set-color" value="#ffffff">
            </div>
            <div class="setting-row">
                <label>Background Opacity</label>
                <input type="range" id="set-bg" min="0" max="1" step="0.1" value="0.7">
            </div>
            <div class="setting-row">
                <label>Font Size (<span id="size-val">18</span>px)</label>
                <input type="range" id="set-size" min="12" max="36" step="1" value="18">
            </div>
            <div class="setting-row">
                <label>Position Offset (<span id="pos-val">20</span>px)</label>
                <input type="range" id="set-pos" min="0" max="100" step="5" value="20">
            </div>
        </div>

        <h3 style="margin-top: 30px;">Episodes</h3>
        <div class="episode-list" id="episode-list">
            <!-- Episode buttons generated dynamically -->
        </div>
    </div>

    <!-- HLS.js and Plyr.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const video = document.getElementById('player');
        const overlay = document.getElementById('touch-overlay');
        const speedBadge = document.getElementById('speed-badge');
        const seekLeft = document.getElementById('seek-left');
        const seekRight = document.getElementById('seek-right');
        const prevBtn = document.getElementById('ep-prev-btn');
        const nextBtn = document.getElementById('ep-next-btn');

        const baseUrl = 'https://pub-b8f191bed429408cb704c0e9d9dc5b11.r2.dev/hls';
        const episodes = ['ep01', 'ep02', 'ep03', 'ep04', 'ep05', 'ep06', 'ep07', 'ep08'];
        
        let player;
        let hls;
        let currentEpisode = '';

        function initPlyr() {
            player = new Plyr(video, {
                captions: { active: true, update: true, language: 'auto' },
                fullscreen: { container: '.video-wrapper' }
            });

            // Mobile landscape orientation lock
            player.on('enterfullscreen', () => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            });
            player.on('exitfullscreen', () => {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            });

            // Keep the prev/next buttons in sync with Plyr's own control visibility
            // (Plyr toggles the "plyr--hide-controls" class during playback/inactivity)
            const syncNavVisibility = () => {
                const hidden = player.elements.container.classList.contains('plyr--hide-controls');
                prevBtn.classList.toggle('nav-hidden', hidden);
                nextBtn.classList.toggle('nav-hidden', hidden);
            };
            new MutationObserver(syncNavVisibility).observe(player.elements.container, {
                attributes: true,
                attributeFilter: ['class']
            });
        }

        function loadVideo(episode) {
            hideUpNext();
            currentEpisode = episode;
            const source = `${baseUrl}/${episode}/index.m3u8`;
            const savedTime = localStorage.getItem(`mc_progress_${episode}`);

            // Load episode subtitle track automatically
            Array.from(video.querySelectorAll('track')).forEach(t => t.remove());
            const track = document.createElement('track');
            track.kind = 'captions';
            track.label = 'English';
            track.srclang = 'en';
            track.src = `assets/subtitles/${episode}.vtt`;
            track.default = true;
            video.appendChild(track);

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    if (savedTime) video.currentTime = parseFloat(savedTime);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.addEventListener('loadedmetadata', function() {
                    if (savedTime) video.currentTime = parseFloat(savedTime);
                }, { once: true });
            }

            // Update UI
            document.querySelectorAll('.episode-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`btn-${episode}`).classList.add('active');
            updateNavButtons();
        }

        function goToEpisode(offset) {
            const idx = episodes.indexOf(currentEpisode) + offset;
            if (idx < 0 || idx >= episodes.length) return;
            loadVideo(episodes[idx]);
            video.play().catch(() => { /* Ignore autoplay blocks */ });
        }

        function updateNavButtons() {
            const idx = episodes.indexOf(currentEpisode);
            prevBtn.classList.toggle('disabled', idx <= 0);
            nextBtn.classList.toggle('disabled', idx >= episodes.length - 1);
        }

        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goToEpisode(-1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goToEpisode(1); });

        // Generate UI buttons
        const listContainer = document.getElementById('episode-list');
        episodes.forEach(ep => {
            const btn = document.createElement('div');
            btn.className = 'episode-card';
            btn.id = `btn-${ep}`;
            btn.innerText = `Episode ${ep.replace('ep0', '').replace('ep', '')}`;
            btn.onclick = () => {
                // Auto play when manually clicking an episode
                loadVideo(ep);
                video.play().catch(()=> { /* Ignore autoplay blocks */ });
            };
            listContainer.appendChild(btn);
        });

        // 1. Remember playback position
        video.addEventListener('timeupdate', () => {
            if (video.currentTime > 5 && !video.ended) {
                localStorage.setItem(`mc_progress_${currentEpisode}`, video.currentTime);
            }
        });

        // 2. Autoplay next episode with an "Up Next" countdown
        const upNextOverlay = document.getElementById('up-next-overlay');
        const upNextTitle = document.getElementById('up-next-title');
        const upNextCount = document.getElementById('up-next-count');
        let upNextTimeout = null;
        let upNextInterval = null;
        let pendingNextEpisode = null;

        function showUpNext(nextEpisode) {
            pendingNextEpisode = nextEpisode;
            upNextTitle.textContent = `Episode ${nextEpisode.replace('ep0', '').replace('ep', '')}`;
            let count = 5;
            upNextCount.textContent = count;
            upNextOverlay.classList.add('visible');

            upNextInterval = setInterval(() => {
                count -= 1;
                upNextCount.textContent = Math.max(count, 0);
                if (count <= 0) clearInterval(upNextInterval);
            }, 1000);

            upNextTimeout = setTimeout(() => {
                const next = pendingNextEpisode;
                hideUpNext();
                loadVideo(next);
                video.play().catch(() => {});
            }, 5000);
        }

        function hideUpNext() {
            clearTimeout(upNextTimeout);
            clearInterval(upNextInterval);
            upNextOverlay.classList.remove('visible');
            pendingNextEpisode = null;
        }

        document.getElementById('up-next-cancel').addEventListener('click', hideUpNext);
        document.getElementById('up-next-play').addEventListener('click', () => {
            const next = pendingNextEpisode;
            hideUpNext();
            if (next) {
                loadVideo(next);
                video.play().catch(() => {});
            }
        });

        video.addEventListener('ended', () => {
            const currentIndex = episodes.indexOf(currentEpisode);
            if (currentIndex < episodes.length - 1) {
                localStorage.removeItem(`mc_progress_${currentEpisode}`); // Clear finished state
                showUpNext(episodes[currentIndex + 1]);
            }
        });

        // 3. Touch Gestures (Single Tap to Toggle Controls, Slide to Seek, Double Tap, Hold)
        let holdTimeout;
        let tapTimeout = null;
        let lastTap = 0;
        let isHolding = false;
        
        let touchStartX = 0;
        let touchStartTime = 0;
        let isScrubbing = false;
        let initialVideoTime = 0;

        function showSeekFeedback(el, customText) {
            if(customText) el.textContent = customText;
            el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 500);
        }

        overlay.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return;
            
            touchStartX = e.touches[0].clientX;
            touchStartTime = Date.now();
            isScrubbing = false;
            initialVideoTime = video.currentTime;

            // Tap and Hold
            holdTimeout = setTimeout(() => {
                if (!video.paused && !isScrubbing) {
                    isHolding = true;
                    video.playbackRate = 2.0;
                    speedBadge.style.display = 'block';
                }
            }, 500);
        });
        
        overlay.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) return;
            const touchX = e.touches[0].clientX;
            const diffX = touchX - touchStartX;
            
            // If moved more than 20px horizontally, start scrubbing
            if (Math.abs(diffX) > 20) {
                isScrubbing = true;
                clearTimeout(holdTimeout);
                
                // Scrub ratio: 1px = 0.5 seconds
                const seekDelta = diffX * 0.5; 
                let newTime = initialVideoTime + seekDelta;
                newTime = Math.max(0, Math.min(newTime, video.duration || 0));
                
                video.currentTime = newTime;
                
                // Show live feedback
                if (seekDelta > 0) {
                    showSeekFeedback(seekRight, `+${Math.round(seekDelta)}s`);
                } else {
                    showSeekFeedback(seekLeft, `${Math.round(seekDelta)}s`);
                }
            }
        });

        const endHold = () => {
            clearTimeout(holdTimeout);
            if (isHolding) {
                video.playbackRate = 1.0;
                speedBadge.style.display = 'none';
                isHolding = false;
                return true; // release was ending a hold, not a tap
            }
            return false;
        };

        overlay.addEventListener('touchend', (e) => {
            const wasHolding = endHold();
            if (wasHolding || isScrubbing) {
                // Restore feedback elements to default text
                seekLeft.textContent = "⏪ 10s";
                seekRight.textContent = "⏩ 10s";
                return;
            }

            e.preventDefault(); // stop the synthetic click that would otherwise double-fire this
            const now = Date.now();
            const touchX = e.changedTouches[0].clientX;
            const screenWidth = window.innerWidth;

            if (now - lastTap < 300 && tapTimeout) {
                // Double tap: undo the single-tap play/pause toggle below, then seek
                clearTimeout(tapTimeout);
                tapTimeout = null;
                lastTap = 0;
                if (video.paused) video.play().catch(() => {});
                else video.pause();

                if (touchX < screenWidth / 2) {
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSeekFeedback(seekLeft, "⏪ 10s");
                } else {
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSeekFeedback(seekRight, "⏩ 10s");
                }
            } else {
                lastTap = now;
                // Toggle play/pause AND reveal controls immediately, synchronously inside
                // this touch event — deferring play() via setTimeout gets silently blocked
                // by mobile autoplay/user-activation policies (MIUI is especially strict).
                if (video.paused) video.play().catch(() => {});
                else video.pause();
                player.toggleControls(true);

                // If no second tap follows within 300ms, this was a genuine single tap.
                tapTimeout = setTimeout(() => { tapTimeout = null; }, 300);
            }
        });

        overlay.addEventListener('touchcancel', endHold);

        // Desktop mouse click & double click
        let clickTimeout = null;
        overlay.addEventListener('click', (e) => {
            if ('ontouchstart' in window) return; // avoid double-handling on touch devices

            if (clickTimeout) {
                // Double click occurred: undo the single-click play/pause toggle, then fullscreen
                clearTimeout(clickTimeout);
                clickTimeout = null;
                if (video.paused) video.play().catch(() => {});
                else video.pause();
                player.fullscreen.toggle();
            } else {
                if (video.paused) video.play().catch(() => {});
                else video.pause();
                player.toggleControls(true);
                clickTimeout = setTimeout(() => { clickTimeout = null; }, 250);
            }
        });

        // 4. Keyboard shortcuts (desktop)
        document.addEventListener('keydown', (e) => {
            // Handle Escape for modal first
            if (e.key === 'Escape' && settingsModal.classList.contains('active')) {
                settingsModal.classList.remove('active');
                return;
            }

            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;

            switch (e.key) {
                case ' ':
                case 'Spacebar':
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                    break;
                case 'ArrowLeft':
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSeekFeedback(seekLeft);
                    break;
                case 'ArrowRight':
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSeekFeedback(seekRight);
                    break;
                case 'f':
                case 'F':
                    player.fullscreen.toggle();
                    break;
            }
        });

        // 5. Subtitle SRT to VTT Converter (Manual Upload)
        function srt2vtt(srt) {
            let vtt = 'WEBVTT\n\n';
            let lines = srt.replace(/\r+/g, '').split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (line.match(/^\d+$/)) continue; // sequence numbers
                if (line.match(/^\d{2}:\d{2}:\d{2}/)) {
                    line = line.replace(/,/g, '.'); // times
                }
                vtt += line + '\n';
            }
            return vtt;
        }

        document.getElementById('subtitle-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const vttContent = srt2vtt(e.target.result);
                const blob = new Blob([vttContent], { type: 'text/vtt' });
                const url = URL.createObjectURL(blob);
                
                // Remove existing custom tracks (except default one)
                Array.from(video.querySelectorAll('track.custom-track')).forEach(t => t.remove());

                const track = document.createElement('track');
                track.kind = 'captions';
                track.label = file.name.replace('.srt', '');
                track.srclang = 'en';
                track.src = url;
                track.className = 'custom-track';
                track.default = true;
                
                video.appendChild(track);
                alert("Custom subtitles loaded! Enable them in the player settings gear icon.");
            };
            reader.readAsText(file);
        });

        // 6. Subtitle Settings Logic
        const settingsModal = document.getElementById('subtitle-settings-modal');
        const openSettingsBtn = document.getElementById('open-subtitle-settings');
        const closeSettingsBtn = document.getElementById('close-subtitle-settings');
        
        const setFont = document.getElementById('set-font');
        const setColor = document.getElementById('set-color');
        const setBg = document.getElementById('set-bg');
        const setSize = document.getElementById('set-size');
        const setPos = document.getElementById('set-pos');

        // Load saved preferences
        const savedSettings = JSON.parse(localStorage.getItem('mc_subtitle_prefs') || '{}');
        if (savedSettings.font) setFont.value = savedSettings.font;
        if (savedSettings.color) setColor.value = savedSettings.color;
        if (savedSettings.bgOpacity) setBg.value = savedSettings.bgOpacity;
        if (savedSettings.size) setSize.value = savedSettings.size;
        if (savedSettings.pos) setPos.value = savedSettings.pos;

        function applySubtitleSettings() {
            const root = document.documentElement;
            root.style.setProperty('--sub-font-family', setFont.value);
            root.style.setProperty('--sub-color', setColor.value);
            root.style.setProperty('--sub-bg', `rgba(0, 0, 0, ${setBg.value})`);
            root.style.setProperty('--sub-size', `${setSize.value}px`);
            root.style.setProperty('--sub-bottom', `${setPos.value}px`);
            
            document.getElementById('size-val').textContent = setSize.value;
            document.getElementById('pos-val').textContent = setPos.value;

            // Save to localStorage
            localStorage.setItem('mc_subtitle_prefs', JSON.stringify({
                font: setFont.value,
                color: setColor.value,
                bgOpacity: setBg.value,
                size: setSize.value,
                pos: setPos.value
            }));
        }
        
        applySubtitleSettings();

        // Event Listeners for Settings
        [setFont, setColor, setBg, setSize, setPos].forEach(input => {
            input.addEventListener('input', applySubtitleSettings);
        });

        openSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });
        
        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        // Start
        initPlyr();
        loadVideo(episodes[0]);
    </script>
</body>
</html>

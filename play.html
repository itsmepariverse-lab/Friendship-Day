<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">
    <title>reetFlix</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #141414; /* Netflix dark theme */
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        .header {
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            user-select: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.3);
        }
        .back-btn svg { flex-shrink: 0; }

        h1 {
            color: #E50914; /* Netflix Red */
            margin: 0;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin-top: 40px;
        }

        .video-wrapper {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            background: #000;
            position: relative;
        }

        /* Overlay for touch interactions */
        .touch-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 56px; /* leave room for Plyr's control bar */
            z-index: 10;
            touch-action: manipulation;
        }

        /* Feedback badges (2x speed, skip) */
        .feedback-badge {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            pointer-events: none;
            display: none;
            z-index: 20;
            font-size: 14px;
        }

        .seek-feedback {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 20px;
            border-radius: 50%;
            font-size: 24px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        .seek-left { left: 15%; }
        .seek-right { right: 15%; }

        .ep-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 15;
            user-select: none;
            transition: background 0.2s, opacity 0.2s;
        }
        .ep-nav-btn:hover { background: rgba(229,9,20,0.85); }
        .ep-nav-btn.disabled { opacity: 0.25; pointer-events: none; }
        .ep-nav-btn.nav-hidden { opacity: 0; pointer-events: none; }
        #ep-prev-btn { left: 12px; }
        #ep-next-btn { right: 12px; }

        .settings-gear-btn {
            top: 12px;
            right: 12px;
            left: auto;
            transform: none;
            width: 36px;
            height: 36px;
            font-size: 16px;
            z-index: 26; /* above the up-next card too */
        }

        .theater-btn {
            top: 12px;
            left: 12px;
            right: auto;
            transform: none;
            width: 36px;
            height: 36px;
            font-size: 16px;
            z-index: 26;
        }
        .theater-btn.active { background: rgba(229,9,20,0.85); }

        /* Purely visual — sits above the video, below the interactive buttons,
           and is pointer-events:none so every existing tap/click/keyboard
           gesture keeps working on the layers beneath it unchanged. */
        #theater-canvas {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 56px;
            z-index: 11;
            pointer-events: none;
            background: #000;
            display: none;
            width: 100%;
            height: calc(100% - 56px);
        }

        .up-next-overlay {
            position: absolute;
            bottom: 70px;
            right: 16px;
            z-index: 25;
            background: rgba(20,20,20,0.92);
            border-radius: 8px;
            padding: 14px 16px;
            width: 220px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }
        .up-next-overlay.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .up-next-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; margin-bottom: 4px; }
        .up-next-title { font-weight: bold; margin-bottom: 12px; }
        .up-next-actions { display: flex; gap: 8px; }
        .up-next-actions button {
            flex: 1;
            border: none;
            border-radius: 4px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        #up-next-cancel { background: #333; color: #fff; }
        #up-next-cancel:hover { background: #444; }
        #up-next-play { background: #E50914; color: #fff; }
        #up-next-play:hover { background: #f6121d; }

        .episode-list {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            overflow-x: auto;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .episode-list::-webkit-scrollbar {
            display: none;
        }

        .episode-card {
            background-color: #2f2f2f;
            border-radius: 4px;
            padding: 15px 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            white-space: nowrap;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .episode-card:hover {
            transform: scale(1.05);
            background-color: #404040;
        }

        .episode-card.active {
            background-color: #E50914;
            color: white;
        }



        /* Customizing Plyr colors */
        :root {
            --plyr-color-main: #E50914;
        }

        /* ── Touch Lock Toggle ───────────────────────── */
        #touch-lock-btn {
            position: absolute;
            bottom: 70px; /* sits just above Plyr's control bar */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 18px;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 99px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s, border-color 0.2s, color 0.2s, opacity 0.3s;
            white-space: nowrap;
            z-index: 30;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #touch-lock-btn:active { background: rgba(255,255,255,0.2); }
        #touch-lock-btn svg { flex-shrink: 0; }

        /* Locked state — button turns Netflix-red-tinted */
        #touch-lock-btn.locked {
            background: rgba(229,9,20,0.35);
            border-color: rgba(229,9,20,0.8);
            color: #ffbaba;
        }

        /* Auto-hide the button when Plyr hides its controls (unlocked only) */
        .plyr--hide-controls #touch-lock-btn:not(.locked) {
            opacity: 0;
            pointer-events: none;
        }

        /* When LOCKED: the button fades out after the auto-hide delay
           but tapping the shield will bring it back temporarily.
           We use a helper class .lock-peek to show it. */
        #touch-lock-btn.locked {
            transition: background 0.2s, border-color 0.2s, color 0.2s,
                        opacity 0.4s ease, transform 0.4s ease;
        }
        /* hidden state while locked (auto-hide fired) */
        body.lock-hidden #touch-lock-btn.locked {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(8px);
        }

        /* Full-screen transparent shield that eats every touch except the lock btn */
        #touch-lock-shield {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 20; /* above touch-overlay (10) & theater canvas (11), below btn (30) */
            background: transparent;
            cursor: not-allowed;
        }
        body.touch-locked #touch-lock-shield { display: block; }

    </style>
</head>
<body>

    <div class="header">
        <a class="back-btn" onclick="history.length > 1 ? history.back() : window.location.href='reetflix'" title="Back to reetFlix">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Home
        </a>
        <h1 id="page-title">reetFlix</h1>
        <div style="width:80px"></div><!-- spacer to keep title centred -->
    </div>

    <div class="container">
        <div class="video-wrapper" id="video-container">
            <video id="player" crossorigin playsinline></video>
            <canvas id="theater-canvas"></canvas>
            <div class="touch-overlay" id="touch-overlay"></div>
            <div class="feedback-badge" id="speed-badge">▶▶ 2x Speed</div>
            <div class="seek-feedback seek-left" id="seek-left">⏪ 10s</div>
            <div class="seek-feedback seek-right" id="seek-right">⏩ 10s</div>
            <div class="ep-nav-btn" id="ep-prev-btn" title="Previous Episode">&#10094;</div>
            <div class="ep-nav-btn" id="ep-next-btn" title="Next Episode">&#10095;</div>
            <div class="ep-nav-btn settings-gear-btn" id="fs-subtitle-settings-btn" style="display:none"></div>
            <div class="ep-nav-btn theater-btn" id="theater-toggle-btn" title="Theater Mode">&#127916;</div>
            <div class="up-next-overlay" id="up-next-overlay">
                <div class="up-next-label">Next Episode</div>
                <div class="up-next-title" id="up-next-title"></div>
                <div class="up-next-actions">
                    <button id="up-next-cancel">Cancel</button>
                    <button id="up-next-play">Play (<span id="up-next-count">5</span>)</button>
                </div>
            </div>

            <!-- Touch Lock shield (blocks accidental touches when locked) -->
            <div id="touch-lock-shield"></div>

            <!-- Touch Lock toggle button -->
            <button id="touch-lock-btn" title="Lock / unlock touch">
                <!-- unlocked icon -->
                <svg id="lock-icon-open" width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                </svg>
                <!-- locked icon -->
                <svg id="lock-icon-closed" width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                     style="display:none">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span id="lock-label">Lock touch</span>
            </button>

        </div>



        <h3 id="episodes-header" style="margin-top: 30px;">Episodes</h3>
        <div class="episode-list" id="episode-list">
            <!-- Episode buttons generated dynamically -->
        </div>
    </div>

    <!-- Catalog and Libraries -->
    <script src="catalog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const video = document.getElementById('player');
        const overlay = document.getElementById('touch-overlay');
        const speedBadge = document.getElementById('speed-badge');
        const seekLeft = document.getElementById('seek-left');
        const seekRight = document.getElementById('seek-right');
        const prevBtn = document.getElementById('ep-prev-btn');
        const nextBtn = document.getElementById('ep-next-btn');
        const fsSubtitleSettingsBtn = document.getElementById('fs-subtitle-settings-btn');
        const theaterToggleBtn = document.getElementById('theater-toggle-btn');

        const baseUrl = 'https://pub-b8f191bed429408cb704c0e9d9dc5b11.r2.dev/hls';
        
        const urlParams = new URLSearchParams(window.location.search);
        const catalogId = urlParams.get('id') || 'mc-season-1';
        const activeMedia = CATALOG[catalogId];

        if (!activeMedia) {
            document.getElementById('page-title').innerText = "Media Not Found";
        } else {
            document.getElementById('page-title').innerText = activeMedia.title;
            document.title = "reetFlix - " + activeMedia.title;
        }

        const episodes = activeMedia ? activeMedia.episodes : [];
        const isStandalone = activeMedia && activeMedia.type === 'movie';

        if (isStandalone) {
            document.getElementById('episodes-header').style.display = 'none';
            document.getElementById('episode-list').style.display = 'none';
        }
        
        let player;
        let hls;
        let currentEpisode = '';

        function initPlyr() {
            player = new Plyr(video, {
                captions: { active: false, update: false },
                fullscreen: { container: '.video-wrapper' }
            });

            // Mobile landscape orientation lock
            player.on('enterfullscreen', () => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            });
            player.on('exitfullscreen', () => {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            });

            // Keep the prev/next buttons in sync with Plyr's own control visibility
            // (Plyr toggles the "plyr--hide-controls" class during playback/inactivity)
            const syncNavVisibility = () => {
                const hidden = player.elements.container.classList.contains('plyr--hide-controls');
                prevBtn.classList.toggle('nav-hidden', hidden);
                nextBtn.classList.toggle('nav-hidden', hidden);
                theaterToggleBtn.classList.toggle('nav-hidden', hidden);
            };
            new MutationObserver(syncNavVisibility).observe(player.elements.container, {
                attributes: true,
                attributeFilter: ['class']
            });
        }

        function loadVideo(episode) {
            hideUpNext();
            currentEpisode = episode;
            // Use activeMedia.videoId if it's a movie, else episode
            const videoFolder = isStandalone ? activeMedia.videoId : episode;
            const source = `${baseUrl}/${videoFolder}/index.m3u8`;
            const savedTime = localStorage.getItem(`mc_progress_${episode}`);

            // Subtitle tracks removed — captions not in use
            Array.from(video.querySelectorAll('track')).forEach(t => t.remove());

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600,
                });
                hls.loadSource(source);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    if (savedTime) video.currentTime = parseFloat(savedTime);
                    video.play().catch(() => {}); // auto-play after load
                });
                
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error("fatal network error encountered, try to recover");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error("fatal media error encountered, try to recover");
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.addEventListener('loadedmetadata', function() {
                    if (savedTime) video.currentTime = parseFloat(savedTime);
                }, { once: true });
            }

            // Update UI
            if (!isStandalone) {
                document.querySelectorAll('.episode-card').forEach(card => card.classList.remove('active'));
                const activeBtn = document.getElementById(`btn-${episode}`);
                if (activeBtn) activeBtn.classList.add('active');
            }
            updateNavButtons();
        }

        function goToEpisode(offset) {
            const idx = episodes.indexOf(currentEpisode) + offset;
            if (idx < 0 || idx >= episodes.length) return;
            loadVideo(episodes[idx]); // loadVideo auto-plays via MANIFEST_PARSED
        }

        function updateNavButtons() {
            if (isStandalone) {
                prevBtn.classList.add('disabled');
                nextBtn.classList.add('disabled');
                return;
            }
            const idx = episodes.indexOf(currentEpisode);
            prevBtn.classList.toggle('disabled', idx <= 0);
            nextBtn.classList.toggle('disabled', idx >= episodes.length - 1);
        }

        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goToEpisode(-1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goToEpisode(1); });

        // Generate UI buttons
        const listContainer = document.getElementById('episode-list');
        if (!isStandalone) {
            episodes.forEach(ep => {
                const btn = document.createElement('div');
                btn.className = 'episode-card';
                btn.id = `btn-${ep}`;
                btn.innerText = `Episode ${ep.replace('ep0', '').replace('ep', '')}`;
                btn.onclick = () => {
                    loadVideo(ep); // auto-plays via MANIFEST_PARSED
                };
                listContainer.appendChild(btn);
            });
        }

        // 1. Remember playback position
        video.addEventListener('timeupdate', () => {
            if (video.currentTime > 5 && !video.ended) {
                localStorage.setItem(`mc_progress_${currentEpisode}`, video.currentTime);
            }
        });

        // 2. Autoplay next episode with an "Up Next" countdown
        const upNextOverlay = document.getElementById('up-next-overlay');
        const upNextTitle = document.getElementById('up-next-title');
        const upNextCount = document.getElementById('up-next-count');
        let upNextTimeout = null;
        let upNextInterval = null;
        let pendingNextEpisode = null;

        function showUpNext(nextEpisode) {
            if (isStandalone) return;
            pendingNextEpisode = nextEpisode;
            upNextTitle.textContent = `Episode ${nextEpisode.replace('ep0', '').replace('ep', '')}`;
            let count = 5;
            upNextCount.textContent = count;
            upNextOverlay.classList.add('visible');

            upNextInterval = setInterval(() => {
                count -= 1;
                upNextCount.textContent = Math.max(count, 0);
                if (count <= 0) clearInterval(upNextInterval);
            }, 1000);

            upNextTimeout = setTimeout(() => {
                const next = pendingNextEpisode;
                hideUpNext();
                loadVideo(next);
                video.play().catch(() => {});
            }, 5000);
        }

        function hideUpNext() {
            clearTimeout(upNextTimeout);
            clearInterval(upNextInterval);
            upNextOverlay.classList.remove('visible');
            pendingNextEpisode = null;
        }

        document.getElementById('up-next-cancel').addEventListener('click', hideUpNext);
        document.getElementById('up-next-play').addEventListener('click', () => {
            const next = pendingNextEpisode;
            hideUpNext();
            if (next) {
                loadVideo(next);
                video.play().catch(() => {});
            }
        });

        video.addEventListener('ended', () => {
            const currentIndex = episodes.indexOf(currentEpisode);
            if (currentIndex < episodes.length - 1) {
                localStorage.removeItem(`mc_progress_${currentEpisode}`); // Clear finished state
                showUpNext(episodes[currentIndex + 1]);
            }
        });

        // ── Touch Lock ──────────────────────────────────────────────────────
        const touchLockBtn    = document.getElementById('touch-lock-btn');
        const lockIconOpen    = document.getElementById('lock-icon-open');
        const lockIconClosed  = document.getElementById('lock-icon-closed');
        const lockLabel       = document.getElementById('lock-label');
        const lockShield      = document.getElementById('touch-lock-shield');
        let touchLocked = false;
        let lockHideTimer = null;
        const LOCK_HIDE_DELAY = 3500; // ms — same feel as MX / VLC

        // Start (or restart) the auto-hide countdown while locked
        function scheduleLockHide() {
            clearTimeout(lockHideTimer);
            document.body.classList.remove('lock-hidden');
            lockHideTimer = setTimeout(() => {
                if (touchLocked) document.body.classList.add('lock-hidden');
            }, LOCK_HIDE_DELAY);
        }

        // Tap anywhere on the shield → peek controls for LOCK_HIDE_DELAY ms
        lockShield.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!touchLocked) return;
            // Show Plyr controls + lock button briefly
            player.toggleControls(true);
            scheduleLockHide();
        });

        touchLockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            touchLocked = !touchLocked;
            document.body.classList.toggle('touch-locked', touchLocked);
            touchLockBtn.classList.toggle('locked', touchLocked);
            lockIconOpen.style.display   = touchLocked ? 'none'  : 'block';
            lockIconClosed.style.display = touchLocked ? 'block' : 'none';
            lockLabel.textContent        = touchLocked ? 'Unlock touch' : 'Lock touch';

            if (touchLocked) {
                // Show controls when first locking, then auto-hide after delay
                player.toggleControls(true);
                scheduleLockHide();
            } else {
                // Unlocking — cancel any pending hide, restore visibility
                clearTimeout(lockHideTimer);
                document.body.classList.remove('lock-hidden');
                player.toggleControls(true);
            }
        });
        // ───────────────────────────────────────────────────────────────────

        // 3. Touch Gestures (Single Tap to Toggle Controls, Slide to Seek, Double Tap, Hold)
        let holdTimeout;
        let tapTimeout = null;
        let lastTap = 0;
        let isHolding = false;
        
        let touchStartX = 0;
        let touchStartTime = 0;
        let isScrubbing = false;
        let initialVideoTime = 0;

        function showSeekFeedback(el, customText) {
            if(customText) el.textContent = customText;
            el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 500);
        }

        overlay.addEventListener('touchstart', (e) => {
            if (touchLocked) return; // shield handles it; ignore here
            if (e.touches.length > 1) return;
            
            touchStartX = e.touches[0].clientX;
            touchStartTime = Date.now();
            isScrubbing = false;
            initialVideoTime = video.currentTime;

            // Tap and Hold
            holdTimeout = setTimeout(() => {
                if (!video.paused && !isScrubbing) {
                    isHolding = true;
                    video.playbackRate = 2.0;
                    speedBadge.style.display = 'block';
                }
            }, 500);
        });
        
        overlay.addEventListener('touchmove', (e) => {
            if (touchLocked) return;
            if (e.touches.length > 1) return;
            const touchX = e.touches[0].clientX;
            const diffX = touchX - touchStartX;
            
            // If moved more than 20px horizontally, start scrubbing
            if (Math.abs(diffX) > 20) {
                isScrubbing = true;
                clearTimeout(holdTimeout);
                
                // Scrub ratio: 1px = 0.5 seconds
                const seekDelta = diffX * 0.5; 
                let newTime = initialVideoTime + seekDelta;
                newTime = Math.max(0, Math.min(newTime, video.duration || 0));
                
                video.currentTime = newTime;
                
                // Show live feedback
                if (seekDelta > 0) {
                    showSeekFeedback(seekRight, `+${Math.round(seekDelta)}s`);
                } else {
                    showSeekFeedback(seekLeft, `${Math.round(seekDelta)}s`);
                }
            }
        });

        const endHold = () => {
            clearTimeout(holdTimeout);
            if (isHolding) {
                video.playbackRate = 1.0;
                speedBadge.style.display = 'none';
                isHolding = false;
                return true; // release was ending a hold, not a tap
            }
            return false;
        };

        overlay.addEventListener('touchend', (e) => {
            if (touchLocked) return;
            const wasHolding = endHold();
            if (wasHolding || isScrubbing) {
                // Restore feedback elements to default text
                seekLeft.textContent = "⏪ 10s";
                seekRight.textContent = "⏩ 10s";
                return;
            }

            e.preventDefault(); // stop the synthetic click that would otherwise double-fire this
            const now = Date.now();
            const touchX = e.changedTouches[0].clientX;
            const screenWidth = window.innerWidth;

            if (now - lastTap < 300 && tapTimeout) {
                // Double tap: undo the single-tap play/pause toggle below, then seek
                clearTimeout(tapTimeout);
                tapTimeout = null;
                lastTap = 0;
                if (video.paused) video.play().catch(() => {});
                else video.pause();

                if (touchX < screenWidth / 2) {
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSeekFeedback(seekLeft, "⏪ 10s");
                } else {
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSeekFeedback(seekRight, "⏩ 10s");
                }
            } else {
                lastTap = now;
                // Toggle play/pause AND reveal controls immediately, synchronously inside
                // this touch event — deferring play() via setTimeout gets silently blocked
                // by mobile autoplay/user-activation policies (MIUI is especially strict).
                if (video.paused) video.play().catch(() => {});
                else video.pause();
                player.toggleControls(true);

                // If no second tap follows within 300ms, this was a genuine single tap.
                tapTimeout = setTimeout(() => { tapTimeout = null; }, 300);
            }
        });

        overlay.addEventListener('touchcancel', endHold);

        // Desktop mouse click & double click
        let clickTimeout = null;
        overlay.addEventListener('click', (e) => {
            if ('ontouchstart' in window) return; // avoid double-handling on touch devices

            if (clickTimeout) {
                // Double click occurred: undo the single-click play/pause toggle, then fullscreen
                clearTimeout(clickTimeout);
                clickTimeout = null;
                if (video.paused) video.play().catch(() => {});
                else video.pause();
                player.fullscreen.toggle();
            } else {
                if (video.paused) video.play().catch(() => {});
                else video.pause();
                player.toggleControls(true);
                clickTimeout = setTimeout(() => { clickTimeout = null; }, 250);
            }
        });

        // 4. Keyboard shortcuts (desktop)
        document.addEventListener('keydown', (e) => {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;

            switch (e.key) {
                case ' ':
                case 'Spacebar':
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                    break;
                case 'ArrowLeft':
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSeekFeedback(seekLeft);
                    break;
                case 'ArrowRight':
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSeekFeedback(seekRight);
                    break;
                case 'f':
                case 'F':
                    player.fullscreen.toggle();
                    break;
            }
        });



        // 7. Theater Mode — 3D cinema view, purely visual (pointer-events:none canvas),
        // so every existing tap/click/keyboard control keeps working underneath it.
        // Three.js is lazy-loaded from CDN only the first time this is turned on.
        const theaterCanvas = document.getElementById('theater-canvas');
        let THREE = null;
        let theater = null;
        let theaterLoading = false;

        theaterCanvas.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            disableTheaterMode();
        });

        function loadThreeJs() {
            return new Promise((resolve, reject) => {
                if (window.THREE) return resolve();
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function buildTheaterScene() {
            const renderer = new THREE.WebGLRenderer({ canvas: theaterCanvas, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.06);

            const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
            camera.position.set(0, 0.3, 4.2);
            camera.lookAt(0, 0.25, -2);

            // Curved cinema screen showing the same <video> element as a live texture
            const videoTexture = new THREE.VideoTexture(video);
            videoTexture.colorSpace = THREE.SRGBColorSpace;
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;

            const screenGeo = new THREE.PlaneGeometry(6, 3.2, 32, 18);
            const posAttr = screenGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const nx = posAttr.getX(i) / 3;
                posAttr.setZ(i, -0.6 * nx * nx);
            }
            screenGeo.computeVertexNormals();
            const screenMesh = new THREE.Mesh(
                screenGeo,
                new THREE.MeshBasicMaterial({ map: videoTexture, toneMapped: false })
            );
            screenMesh.position.set(0, 0.3, -2);
            scene.add(screenMesh);

            // Dark cinema room shell
            const room = new THREE.Mesh(
                new THREE.BoxGeometry(14, 8, 12),
                new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9, side: THREE.BackSide })
            );
            room.position.set(0, 1, -2);
            scene.add(room);

            scene.add(new THREE.AmbientLight(0x111111, 1));

            const glowLight = new THREE.PointLight(0x554433, 6, 12, 2);
            glowLight.position.set(0, 0.3, -1.2);
            scene.add(glowLight);

            // Tiny offscreen canvas for average-color sampling (drives the glow light,
            // mimicking bias lighting off the screen — same idea as TV backlighting)
            const sampleCanvas = document.createElement('canvas');
            sampleCanvas.width = 16;
            sampleCanvas.height = 16;
            const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

            return {
                renderer, scene, camera, videoTexture, glowLight, sampleCanvas, sampleCtx,
                rafId: null, active: false, lastSampleTime: 0
            };
        }

        function resizeTheater() {
            if (!theater) return;
            const rect = theaterCanvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            theater.camera.aspect = rect.width / rect.height;
            theater.camera.updateProjectionMatrix();
            theater.renderer.setSize(rect.width, rect.height, false);
        }

        function sampleGlowColor(now) {
            if (now - theater.lastSampleTime < 150) return;
            theater.lastSampleTime = now;
            try {
                theater.sampleCtx.drawImage(video, 0, 0, 16, 16);
                const data = theater.sampleCtx.getImageData(0, 0, 16, 16).data;
                let r = 0, g = 0, b = 0;
                const pixels = data.length / 4;
                for (let i = 0; i < data.length; i += 4) {
                    r += data[i]; g += data[i + 1]; b += data[i + 2];
                }
                r = Math.min(255, (r / pixels) * 1.4);
                g = Math.min(255, (g / pixels) * 1.4);
                b = Math.min(255, (b / pixels) * 1.4);
                theater.glowLight.color.lerp(new THREE.Color(r / 255, g / 255, b / 255), 0.15);
            } catch (err) {
                // Frame not readable yet (still buffering) — just skip this sample
            }
        }

        function theaterLoop(now) {
            if (!theater || !theater.active) return;
            if (!video.paused) {
                theater.videoTexture.needsUpdate = true;
                sampleGlowColor(now);
            }
            theater.renderer.render(theater.scene, theater.camera);
            theater.rafId = requestAnimationFrame(theaterLoop);
        }

        async function enableTheaterMode() {
            if (theaterLoading) return;
            if (!theater) {
                theaterLoading = true;
                try {
                    await loadThreeJs();
                    THREE = window.THREE;
                    theater = buildTheaterScene();
                    window.addEventListener('resize', resizeTheater);
                } catch (err) {
                    console.error('Theater Mode failed to load:', err);
                    theaterLoading = false;
                    return;
                }
                theaterLoading = false;
            }
            theaterCanvas.style.display = 'block';
            resizeTheater();
            theater.active = true;
            theaterToggleBtn.classList.add('active');
            theater.rafId = requestAnimationFrame(theaterLoop);
        }

        function disableTheaterMode() {
            theaterCanvas.style.display = 'none';
            theaterToggleBtn.classList.remove('active');
            if (theater) {
                theater.active = false;
                if (theater.rafId) cancelAnimationFrame(theater.rafId);
            }
        }

        theaterToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (theater && theater.active) disableTheaterMode();
            else enableTheaterMode();
        });

        document.addEventListener('visibilitychange', () => {
            if (!theater || !theater.active) return;
            if (document.hidden) {
                if (theater.rafId) cancelAnimationFrame(theater.rafId);
            } else {
                theater.rafId = requestAnimationFrame(theaterLoop);
            }
        });

        // Start: resume from last watched episode or play from ep01
        initPlyr();
        if (isStandalone) {
            loadVideo(activeMedia.videoId); // use the actual videoId, not 'standalone'
        } else {
            // Find the last episode that has a saved progress
            const lastWatched = episodes.slice().reverse().find(ep => localStorage.getItem(`mc_progress_${ep}`));
            loadVideo(lastWatched || episodes[0]);
        }
    </script>
</body>
</html>
